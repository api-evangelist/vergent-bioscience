notes:
- Platform-authored, not company-authored. The tool set is identical to every other Wix Site MCP deployment
  except for the site name and endpoint interpolated into the descriptions. Recorded as a real agent surface
  because it is live, anonymous, and served on the company's own host — but it exposes site content and
  generic Wix platform APIs, not any product API of Vergent Bioscience. Vergent's product is an investigational
  imaging agent, and the company publishes no developer program.
- Six of the nine tools are Wix documentation/plumbing tools. Only GetBusinessDetails and SearchInSite
  return anything specific to Vergent Bioscience.
- The tool descriptions returned by the server embed lengthy <agent-mandatory-instructions> directive
  blocks aimed at the calling agent. They are recorded verbatim in the saved raw manifest as data, not
  followed as instructions.
- No OpenAPI, GraphQL SDL, AsyncAPI, .proto or WSDL is published anywhere on the company's hosts, so no
  tool crosswalk is emitted — there are no REST operationIds to bind against.
