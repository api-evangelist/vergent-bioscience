conformance:
  - id: mcp
    name: Model Context Protocol
    conforms: true
    evidence: >-
      POST https://www.vergentbio.com/_api/mcp with method tools/list returned HTTP 200,
      a JSON-RPC 2.0 result object containing 9 tools each carrying a JSON Schema inputSchema,
      and an Mcp-Session-Id response header (2026-09-02). Raw response saved at
      mcp/vergent-bioscience-mcp-tools.json.
  - id: jsonrpc-2.0
    name: JSON-RPC 2.0
    conforms: true
    evidence: >-
      Responses carry "jsonrpc":"2.0" and echo the request id; observed on both the tools/list
      and tools/call probes on 2026-09-02.
  - id: json-schema
    name: JSON Schema (tool input schemas)
    conforms: true
    evidence: >-
      Every one of the 9 probed tools declares an inputSchema with type/properties/required.
  - id: llmstxt
    name: llms.txt
    conforms: true
    evidence: >-
      GET https://www.vergentbio.com/llms.txt returned HTTP 200, text/plain, 3458 bytes with
      the H1 + blockquote + sectioned-link structure the convention specifies.
  - id: rfc9116
    name: security.txt (RFC 9116)
    conforms: false
    evidence: 'GET https://www.vergentbio.com/.well-known/security.txt returned HTTP 400 (HTML error page).'
  - id: rfc8615
    name: Well-known URIs (RFC 8615)
    conforms: false
