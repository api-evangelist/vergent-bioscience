aid: vergent-bioscience
name: Vergent Bioscience
description: >-
  Vergent Bioscience is a clinical-stage biotechnology company headquartered in Minneapolis,
  Minnesota, developing tumor-targeted fluorescent imaging agents for real-time intraoperative
  tumor visualization. Its lead compound, abenacianine for injection (VGT-309), is designed to
  let surgeons see previously undetected or difficult-to-find tumors during minimally invasive
  and robotic-assisted cancer surgery so that all tumor tissue can be removed in a single
  procedure. The company is first evaluating VGT-309 in lung cancer with the stated intent to
  expand into a wide range of solid tumors. Vergent publishes no developer program, no REST or
  GraphQL API, and no SDKs — it is a therapeutics and imaging-agent developer, not a software
  vendor. The only machine-readable surfaces on its own domain are a Wix-platform-generated
  llms.txt and a live, anonymous Model Context Protocol endpoint at /_api/mcp that exposes
  nine site-content and Wix-platform tools.
