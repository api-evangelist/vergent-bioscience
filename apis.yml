apis:
- name: Vergent Bioscience Site MCP
  description: >-
    A live, anonymous Model Context Protocol endpoint served on the company's own host and
    advertised from its own llms.txt. Provided by the Wix Site MCP platform rather than
    authored by Vergent, it exposes nine tools — site content search, business details, Wix
    documentation lookups, anonymous visitor-token issuance, and two generic Wix REST API
    passthroughs. A tools/list probe on 2026-09-02 returned HTTP 200 with full JSON Schema
    input schemas and required no credentials.
